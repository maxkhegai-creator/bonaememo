  const y = e.target.closest('[data-sug]'), n = e.target.closest('[data-sugno]');
  if (y) { openRemind(S.msgs.find(x => x.id === +y.dataset.sug)); return; }
  const jb = e.target.closest('[data-jump]'); if (jb && !jb.classList.contains('sel')) { jumpToMsg(+jb.dataset.jump); return; }
  const r = e.target.closest('[data-rem]'); if (r && !r.classList.contains('sel')) { openRemind(S.msgs.find(x => x.id === +r.dataset.rem)); return; }
  if (n) { const m = S.msgs.find(x => x.id === +n.dataset.sugno); m.dismissed = true; save(); renderChat(); return; }
  if (selected && !e.target.closest('.bubble.sel')) { selected = null; renderChat(); }
});
function renderSelBar() {
  const m = S.msgs.find(x => x.id === selected);
  $('selBar').hidden = !m;
  if (!m) return;
  $('selChips').innerHTML = `<button class="chip chip-none${m.f ? '' : ' on'}" data-f="">폴더 없음</button>` + S.folders.map(f => `<button class="chip${m.f === f.id ? ' on' : ''}" data-f="${f.id}" style="--c:${f.c}">${esc(f.name)}</button>`).join('');
}
$('selChips').addEventListener('click', e => {
  const b = e.target.closest('[data-f]'); const m = S.msgs.find(x => x.id === selected); if (!b || !m) return;
  const had = m.f;
  m.f = !b.dataset.f || m.f === b.dataset.f ? null : b.dataset.f;
  if (!m.f && !had) { selected = null; renderChat(); return; }
  if (m.f) touch(m.f);
  save(); selected = null; renderChat();
  toast(m.f ? `'${folderOf(m.f).name}'에 저장했어요` : '일반 메모로 돌려놨어요');
});
$('bellBtn').addEventListener('click', () => {
  const text = input.value.trim();
  openRemind({ text, suggest: text ? parseWhen(text) : null }, true);
});
$('remMsg').addEventListener('click', () => { const m = S.msgs.find(x => x.id === selected); if (m) openRemind(m); });
$('cancelSel').addEventListener('click', () => { selected = null; renderChat(); });
$('delMsg').addEventListener('click', () => { S.msgs = S.msgs.filter(m => m.id !== selected); selected = null; save(); renderChat(); toast('삭제했어요'); });

// "더보기": every folder. Tap = turn on, long press = move into the chat row, pin button = pin/unpin.
function openMore() {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  const draw = () => {
    const row = rowFolders();
    const pins = S.folders.filter(f => f.pin).length;
    bg.innerHTML = `<div class="sheet more-sheet" role="dialog" aria-label="전체 폴더">
      <div style="display:flex;align-items:center;justify-content:space-between"><h2>전체 폴더 ${S.folders.length}</h2><button type="button" class="btn" data-close="1">닫기</button></div>
      <p>누르면 켜져요 · 꾹 누르면 채팅 화면으로 옮겨요 · 핀으로 고정 (${pins}/${MAX_PIN})</p>
      <div class="fgrid more-grid">${S.folders.map(f => `
        <div class="fcell">
          <button class="ring fold-lg${S.active === f.id ? ' on' : ''}" data-f="${f.id}" style="--c:${f.c}" aria-label="${esc(f.name)} 켜기">${folderSVG(S.active === f.id, '')}</button>
          <strong>${esc(f.name)}</strong>
          <span class="more-meta">${row.includes(f) ? '<small>채팅 화면</small>' : '<small>&nbsp;</small>'}<button type="button" class="pinbtn${f.pin ? ' on' : ''}" data-pin="${f.id}" aria-pressed="${!!f.pin}" aria-label="${esc(f.name)} 고정">${PIN_SVG}</button></span>
        </div>`).join('')}
        <div class="fcell"><button class="ring add" data-add="1" aria-label="새 폴더">+</button><strong>새 폴더</strong></div>
      </div>
    </div>`;
  };
  draw();
  $('app').appendChild(bg);
  const close = () => bg.remove();
  let t = null, long = false;
  bg.addEventListener('pointerdown', e => {
    const b = e.target.closest('[data-f]'); long = false; if (!b) return;
    t = setTimeout(() => {
      long = true;
      const f = folderOf(b.dataset.f);
      if (rowFolders().includes(f)) { toast(`'${f.name}'은 이미 채팅 화면에 있어요`); return; }
      touch(f.id); save(); renderCircles(); draw();
      if (navigator.vibrate) try { navigator.vibrate(15); } catch {}
      toast(`'${f.name}'을 채팅 화면으로 옮겼어요`);
    }, 500);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => bg.addEventListener(ev, () => clearTimeout(t)));
  bg.addEventListener('contextmenu', e => e.preventDefault());
  bg.addEventListener('click', e => {
    if (e.target === bg || e.target.closest('[data-close]')) return close();
    if (e.target.closest('[data-add]')) { close(); return openSheet(null); }
    const pb = e.target.closest('[data-pin]');
    if (pb) {
      const f = folderOf(pb.dataset.pin);
      if (togglePin(f)) draw();
      return;
    }
    const b = e.target.closest('[data-f]'); if (!b || long) return;
    S.active = b.dataset.f; touch(S.active); save(); close(); renderChat();
    toast(`'${folderOf(S.active).name}' 켜짐 · 보내는 메모가 여기에 저장돼요`);
  });
}
const PIN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l-1 6 4 4H6l4-4z"/><path d="M12 13v8"/></svg>';

// Long-press menu for a circle: pin, color, rename, open, delete
function openActions(f) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  let mode = null;
  const draw = () => {
    const pins = S.folders.filter(x => x.pin).length;
    bg.innerHTML = `<div class="sheet act-sheet" role="dialog" aria-label="${esc(f.name)} 설정">
      <div class="act-head">
        <span class="act-dot fold-sm" style="--c:${f.c}">${folderSVG(false, '')}</span>
        <div><h2>${esc(f.name)}</h2><p>메모 ${S.msgs.filter(m => m.f === f.id).length}개${f.pin ? ' · 고정됨' : ''}</p></div>
      </div>
      <div class="act-list">
        <button type="button" class="act" data-a="pin">${PIN_SVG}<span>${f.pin ? '고정 풀기' : '고정하기'}</span><small>${f.pin ? '' : `${pins}/${MAX_PIN}`}</small></button>
        <button type="button" class="act" data-a="color" aria-expanded="${mode === 'color'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg><span>색 바꾸기</span><i class="act-sw" style="--c:${f.c}"></i></button>
        ${mode === 'color' ? `<div class="act-colors">${COLORS.map(c => `<button type="button" class="chip${c === f.c ? ' on' : ''}" data-c="${c}" style="--c:${c}" aria-label="색상"></button>`).join('')}</div>` : ''}
        <button type="button" class="act" data-a="name" aria-expanded="${mode === 'name'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span>이름 바꾸기</span></button>
        ${mode === 'name' ? `<form class="act-name"><input id="actName" maxlength="12" value="${esc(f.name)}" aria-label="새 이름"><button class="btn primary">저장</button></form>` : ''}
        <button type="button" class="act" data-a="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z"/></svg><span>폴더 열기</span></button>
        <button type="button" class="act warn" data-a="del"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg><span>${mode === 'del' ? '한 번 더 누르면 삭제' : '폴더 삭제'}</span></button>
      </div>
      <button type="button" class="btn act-close" data-close="1">닫기</button>
    </div>`;
    if (mode === 'name') { const i = bg.querySelector('#actName'); i.focus(); i.select(); }
  };
  draw();
  $('app').appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener('submit', e => {
    e.preventDefault();
    const v = bg.querySelector('#actName').value.trim(); if (!v) return;
    f.name = v; save(); renderChat(); mode = null; draw(); toast('이름을 바꿨어요');
  });
  bg.addEventListener('click', e => {
    if (e.target === bg || e.target.closest('[data-close]')) return close();
    const c = e.target.closest('[data-c]');
    if (c) { f.c = c.dataset.c; save(); renderChat(); draw(); return; }
    const a = e.target.closest('[data-a]'); if (!a) return;
    const act = a.dataset.a;
    if (act === 'pin') { if (togglePin(f)) close(); }
    else if (act === 'color' || act === 'name') { mode = mode === act ? null : act; draw(); }
    else if (act === 'open') { close(); openFolder = f.id; renderPanel(); $('panel').classList.add('open'); }
    else if (act === 'del') {
      if (mode !== 'del') { mode = 'del'; draw(); return; }
      S.folders = S.folders.filter(x => x.id !== f.id);
      S.msgs.forEach(m => { if (m.f === f.id) m.f = null; });
      if (S.active === f.id) S.active = null;
      save(); close(); renderChat();
      toast('폴더를 삭제했어요. 메모는 채팅에 남아 있어요');
    }
  });
}

function openSheet(folderId) {
  const f = folderOf(folderId);
  let color = f ? f.c : COLORS[S.folders.length % COLORS.length];
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<form class="sheet">
    <h2>${f ? '폴더 편집' : '새 폴더'}</h2>
    <p>동그라미를 눌러 켜두면, 끌 때까지 보내는 메모가 채팅과 이 폴더에 함께 저장돼요.</p>
    <input id="folderName" maxlength="12" placeholder="예: 장보기, 아이디어, 할 일" value="${esc(f ? f.name : '')}">
    <label class="pinrow"><input type="checkbox" id="folderPin"${f && f.pin ? ' checked' : ''}> 채팅 화면에 고정 <small>(최대 ${MAX_PIN}개)</small></label>
    <div style="display:flex;gap:10px" id="colors">${COLORS.map(c => `<button type="button" class="chip${c === color ? ' on' : ''}" data-c="${c}" style="--c:${c};width:30px;height:30px;padding:0" aria-label="색상"></button>`).join('')}</div>
    <div class="acts">${f ? '<button type="button" class="btn warn" id="sheetDel">폴더 삭제</button>' : ''}<button type="button" class="btn" id="sheetCancel">취소</button><button class="btn primary">저장</button></div>
  </form>`;
  $('app').appendChild(bg);
  const name = bg.querySelector('#folderName'); name.focus(); name.select();
  const close = () => bg.remove();
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  bg.querySelector('#colors').addEventListener('click', e => {
    const b = e.target.closest('[data-c]'); if (!b) return;
    color = b.dataset.c; bg.querySelectorAll('[data-c]').forEach(x => x.classList.toggle('on', x === b));
  });
  bg.querySelector('#sheetCancel').addEventListener('click', close);
  const del = bg.querySelector('#sheetDel');
  if (del) del.addEventListener('click', () => {
    if (del.dataset.armed) {
      S.folders = S.folders.filter(x => x.id !== f.id);
      S.msgs.forEach(m => { if (m.f === f.id) m.f = null; });
      if (S.active === f.id) S.active = null;
      save(); close(); renderChat(); if (openFolder === f.id) { openFolder = null; $('panel').classList.remove('open'); }
      toast('폴더를 삭제했어요. 메모는 채팅에 남아 있어요');
    } else { del.dataset.armed = 1; del.textContent = '한 번 더 누르면 삭제'; }
  });
  bg.querySelector('form').addEventListener('submit', e => {
    e.preventDefault();
    const v = name.value.trim(); if (!v) { name.focus(); return; }
    let pin = bg.querySelector('#folderPin').checked;
    if (pin && !(f && f.pin) && S.folders.filter(x => x.pin).length >= MAX_PIN) { pin = false; toast(`고정은 ${MAX_PIN}개까지예요. 다른 고정을 먼저 풀어주세요`); }
    const pinVal = pin ? (f && f.pin ? f.pin : Date.now()) : 0;
    if (f) { f.name = v; f.c = color; f.pin = pinVal; } else S.folders.push({ id: 'f' + Date.now(), name: v, c: color, pin: pinVal, used: Date.now() });
    save(); close(); renderChat();
    if (openFolder) renderPanel();
    toast(f ? '저장했어요' : `'${v}' 폴더를 만들었어요`);
  });
}

// Follow the on-screen keyboard: size the app to what is actually visible
const appEl = $('app');
function fitViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  appEl.style.height = vv.height + 'px';
  appEl.style.transform = `translateY(${vv.offsetTop}px)`;
  // Remember the tallest viewport we've seen (no keyboard); anything much shorter means the keyboard is up.
  if (!fitViewport.base || Math.abs(window.innerWidth - fitViewport.w) > 50) { fitViewport.base = 0; fitViewport.w = window.innerWidth; }
  fitViewport.base = Math.max(fitViewport.base, vv.height);
  const typing = document.activeElement && /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName);
  const touch = matchMedia('(pointer: coarse)').matches;
  appEl.classList.toggle('kb', typing && (touch || vv.height < fitViewport.base - 120));
  window.scrollTo(0, 0);
}
let fitQueued = false;
const fitSoon = () => { if (fitQueued) return; fitQueued = true; requestAnimationFrame(() => { fitQueued = false; fitViewport(); }); };
if (window.visualViewport) {
  visualViewport.addEventListener('resize', () => { const atEnd = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 40; fitViewport(); if (atEnd) chat.scrollTop = chat.scrollHeight; });
  visualViewport.addEventListener('scroll', fitSoon);
}

// Stop iOS from dragging the whole page while the keyboard is open (the "shaking").
// A swipe may only scroll an inner list that can still move in that direction.
let touchY = 0;
document.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });

// Like Instagram: swipe down on the chat while typing and the keyboard goes away
let dismissY = null;
chat.addEventListener('touchstart', e => { dismissY = appEl.classList.contains('kb') ? e.touches[0].clientY : null; }, { passive: true });
chat.addEventListener('touchmove', e => {
  if (dismissY === null) return;
  if (e.touches[0].clientY - dismissY > 40) { dismissY = null; document.activeElement && document.activeElement.blur(); }
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) return;
  const dy = e.touches[0].clientY - touchY; // > 0: finger moving down (content scrolls up)
  for (let el = e.target; el && el !== document.body; el = el.parentElement) {
    if (el.scrollHeight <= el.clientHeight + 1) continue;
    const oy = getComputedStyle(el).overflowY;
    if (oy !== 'auto' && oy !== 'scroll') continue;
    const atTop = el.scrollTop <= 0, atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
    if ((dy > 0 && atTop) || (dy < 0 && atBottom)) break; // would chain to the page
    return; // let this list scroll normally
  }
  if (e.target.closest && e.target.closest('textarea') && e.target.scrollHeight > e.target.clientHeight) return;
  e.preventDefault();
}, { passive: false });
input.addEventListener('focus', () => setTimeout(() => { fitViewport(); chat.scrollTop = chat.scrollHeight; }, 300));
document.addEventListener('focusin', () => { fitViewport(); setTimeout(fitViewport, 350); });
document.addEventListener('focusout', () => setTimeout(fitViewport, 100));
fitViewport();

// Keep the chat padded by the floating header and dock
const dockEl = $('dock'), headEl = document.querySelector('.app > header');
const ro = new ResizeObserver(() => {
  appEl.style.setProperty('--top', headEl.offsetHeight + 'px');
  appEl.style.setProperty('--bottom', dockEl.offsetHeight + 'px');
  appEl.style.setProperty('--tabsh', document.querySelector('.tabs').offsetHeight + 20 + 'px');
});
ro.observe(dockEl); ro.observe(headEl);

// ---- Login (first launch). Local only for now; real auth + subscriptions plug in here later. ----
const PROVIDERS = { apple: 'Apple', google: 'Google', email: '이메일' };
function acctLabel() {
  const u = S.user; if (!u) return '-';
  return u.email ? u.email : PROVIDERS[u.provider] + ' 계정';
}
function showLogin(on) {
  $('login').hidden = !on;
  if (on) { $('lgForm').hidden = true; $('lgEmailBtn').hidden = false; $('lgEmail').value = ''; $('lgGo').disabled = true; }
}
function signIn(provider, email) {
  S.user = { provider, email: email || '', since: Date.now(), plan: 'free' };
  save(); showLogin(false); renderProfile();
  toast(`${PROVIDERS[provider]} 계정으로 로그인했어요`);
}
$('lgLogo').innerHTML = `<img src="${LOGO}" alt="보내메모 로고">`;
$('login').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) signIn(b.dataset.p); });
$('lgEmailBtn').addEventListener('click', () => { $('lgEmailBtn').hidden = true; $('lgForm').hidden = false; $('lgEmail').focus(); });
$('lgEmail').addEventListener('input', () => { $('lgGo').disabled = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('lgEmail').value.trim()); });
$('lgForm').addEventListener('submit', e => { e.preventDefault(); if (!$('lgGo').disabled) signIn('email', $('lgEmail').value.trim()); });
$('pfBody').addEventListener('click', e => {
  const b = e.target.closest('[data-acct]'); if (!b) return;
  if (b.dataset.acct === 'premium') toast('구독 기능은 곧 추가될 예정이에요');
  if (b.dataset.acct === 'logout') { delete S.user; save(); showLogin(true); }
});
showLogin(!S.user);

// ---- Memo search ----
let srFolder = null;
function openSearch() {
  srFolder = null; $('srInput').value = ''; $('srClear').hidden = true;
  $('search').hidden = false; renderSearch();
  setTimeout(() => $('srInput').focus(), 50);
}
function closeSearch() { $('srInput').blur(); $('search').hidden = true; }
function renderSearch() {
  const q = $('srInput').value.trim().toLowerCase();
  const used = S.folders.filter(f => S.msgs.some(m => m.f === f.id));
  $('srChips').innerHTML = `<button type="button" class="sr-chip${srFolder ? '' : ' on'}" data-f="">전체</button>` +
    used.map(f => `<button type="button" class="sr-chip${srFolder === f.id ? ' on' : ''}" data-f="${f.id}" style="--c:${f.c}"><i></i>${esc(f.name)}</button>`).join('');
  if (!q && !srFolder) { $('srList').innerHTML = `<p class="sr-empty">찾고 싶은 단어를 입력하세요.<br>폴더를 눌러서 그 폴더 메모만 볼 수도 있어요.</p>`; return; }
  const hits = S.msgs.filter(m => m.kind !== 'alert' && (!srFolder || m.f === srFolder) &&
    (!q || (m.text || '').toLowerCase().includes(q) || (!m.text && m.img && '사진'.includes(q)))).slice().reverse();
  if (!hits.length) { $('srList').innerHTML = `<p class="sr-empty">'${esc($('srInput').value.trim())}'에 맞는 메모가 없어요.</p>`; return; }
  const mark = t => { const e = esc(t); if (!q) return e; const qe = esc(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); return e.replace(new RegExp(qe, 'gi'), x => `<mark>${x}</mark>`); };
  $('srList').innerHTML = `<p class="sr-count">메모 ${hits.length}개</p>` + hits.map(m => {
    const f = S.folders.find(x => x.id === m.f);
    return `<button type="button" class="sr-item" data-id="${m.id}">${m.img ? `<img src="${m.img}" alt="">` : ''}<span class="sr-body"><span class="sr-text">${m.text ? mark(m.text) : '사진'}</span><span class="sr-meta">${fmtDay(m.t)} ${fmtTime(m.t)}${f ? ` · <i style="--c:${f.c}"></i>${esc(f.name)}` : ''}</span></span></button>`;
  }).join('');
}
$('searchBtn').addEventListener('click', openSearch);
$('srCancel').addEventListener('click', closeSearch);
$('srInput').addEventListener('input', () => { $('srClear').hidden = !$('srInput').value; renderSearch(); });
$('srInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('srInput').blur(); });
$('srClear').addEventListener('click', () => { $('srInput').value = ''; $('srClear').hidden = true; renderSearch(); $('srInput').focus(); });
$('srChips').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; srFolder = b.dataset.f || null; renderSearch(); });
$('srList').addEventListener('click', e => {
  const b = e.target.closest('.sr-item'); if (!b) return;
  closeSearch(); goTab('chat', $('tabChat')); setTimeout(() => jumpToMsg(b.dataset.id), 80);
});

renderChat();

// Offline support: register the service worker when served over https
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
